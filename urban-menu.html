<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now - Urban Crust | Best Fast Food in Islamabad</title>
    <meta name="description" content="Order from Urban Crust - Burgers, Pizzas, Deals, Wings & More! Fast delivery in Islamabad!">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FFD700;
            --secondary: #FFA500;
            --dark: #1a1a1a;
            --black: #000;
            --white: #fff;
            --success: #25D366;
            --danger: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
            color: var(--white);
            overflow-x: hidden;
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 165, 0, 0.05) 0%, transparent 50%);
            z-index: -1;
            animation: backgroundMove 20s ease infinite;
        }

        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        /* HEADER STYLES */
        header {
            background: linear-gradient(135deg, var(--black) 0%, var(--dark) 100%);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3);
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cart-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--black);
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.6);
            z-index: 999;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-floating-btn:hover {
            transform: scale(1.1);
        }

        .cart-floating-btn .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: bold;
            border: 3px solid var(--black);
        }

        /* MENU CONTAINER */
        .menu-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .menu-header {
            text-align: center;
            padding: 2rem 1rem;
            margin-bottom: 2rem;
            animation: fadeInDown 1s;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-header h1 {
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            margin-bottom: 0.5rem;
        }

        .menu-header p {
            color: #ccc;
            font-size: 1.1rem;
        }

        /* CATEGORY TABS */
        .category-tabs {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            position: sticky;
            top: 70px;
            background: rgba(0, 0, 0, 0.95);
            padding: 1rem;
            border-radius: 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background: var(--dark);
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--primary);
            color: var(--black);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        /* MENU SECTION */
        .menu-section {
            background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
            border-radius: 30px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 3px solid var(--primary);
            animation: fadeInUp 0.6s;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-section h2 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 1.5rem;
            text-align: center;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* MENU ITEM CARD */
        .menu-item {
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .menu-item:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.8rem;
        }

        .item-name {
            color: var(--white);
            font-size: 1.3rem;
            font-weight: bold;
            flex: 1;
        }

        .item-price {
            color: var(--secondary);
            font-size: 1.4rem;
            font-weight: bold;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .item-desc {
            color: #ccc;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .item-sizes {
            background: rgba(255, 215, 0, 0.1);
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .item-sizes-title {
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .size-price-list {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .size-price-item {
            color: #aaa;
            font-size: 0.85rem;
        }

        .size-price-item strong {
            color: var(--white);
        }

        .special-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--danger);
            color: white;
            padding: 0.4rem 0.9rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ADD TO CART BUTTON */
        .add-to-cart-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--black);
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1rem;
        }

        .add-to-cart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
        }

        /* SIZE SELECTION MODAL */
        .size-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .size-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .size-modal-content {
            background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
            border-radius: 30px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--primary);
            position: relative;
            animation: slideUp 0.4s;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .size-modal h3 {
            color: var(--primary);
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .close-size-modal {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--black);
            color: var(--primary);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .close-size-modal:hover {
            transform: rotate(90deg);
            background: var(--primary);
            color: var(--black);
        }

        .size-options {
            display: grid;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .size-option {
            background: var(--dark);
            color: var(--white);
            border: 2px solid var(--primary);
            padding: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .size-option:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.02);
        }

        .size-option.selected {
            background: var(--primary);
            color: var(--black);
            transform: scale(1.05);
        }

        .size-option-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .size-option-price {
            color: var(--secondary);
            font-size: 1.4rem;
            font-weight: bold;
        }

        .size-option.selected .size-option-price {
            color: var(--black);
        }

        .confirm-size-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--black);
            border: none;
            padding: 1rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .confirm-size-btn:hover {
            transform: scale(1.05);
        }

        .confirm-size-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* CART SIDEBAR */
        .cart-sidebar {
            position: fixed;
            right: -450px;
            top: 0;
            width: 450px;
            height: 100vh;
            background: linear-gradient(145deg, #2a2a2a, #1f1f1f);
            border-left: 3px solid var(--primary);
            z-index: 10001;
            transition: right 0.4s ease;
            overflow-y: auto;
            box-shadow: -5px 0 30px rgba(0, 0, 0, 0.8);
        }

        .cart-sidebar.show {
            right: 0;
        }

        .cart-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .cart-header h2 {
            color: var(--black);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .close-cart {
            background: var(--black);
            color: var(--primary);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .close-cart:hover {
            transform: rotate(90deg);
        }

        .cart-items {
            padding: 1.5rem;
            min-height: 200px;
        }

        .cart-item {
            background: rgba(255, 215, 0, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.8rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            color: var(--white);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .cart-item-size {
            color: var(--primary);
            font-size: 0.85rem;
            margin-top: 0.3rem;
        }

        .cart-item-unit-price {
            color: #999;
            font-size: 0.8rem;
            margin-top: 0.2rem;
        }

        .cart-item-total {
            color: var(--secondary);
            font-weight: bold;
            font-size: 1.3rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.8rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--dark);
            border-radius: 25px;
            padding: 0.4rem 1rem;
        }

        .qty-btn {
            background: var(--primary);
            color: var(--black);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            transform: scale(1.15);
        }

        .qty-display {
            color: var(--white);
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            font-size: 1.1rem;
        }

        .remove-item {
            background: var(--danger);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 0.85rem;
        }

        .remove-item:hover {
            background: #c0392b;
            transform: scale(1.05);
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 1rem;
            color: #888;
        }

        .cart-empty i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .cart-summary {
            background: rgba(255, 215, 0, 0.1);
            border-top: 3px solid var(--primary);
            padding: 1.5rem;
            position: sticky;
            bottom: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--white);
            font-size: 1.1rem;
        }

        .summary-total {
            border-top: 2px solid var(--primary);
            padding-top: 1rem;
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.5rem;
            color: var(--primary);
        }

        .checkout-btn {
            background: linear-gradient(135deg, var(--success), #128C7E);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .checkout-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.5);
        }

        .clear-cart-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 0.8rem;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 0.5rem;
            transition: all 0.3s;
        }

        .clear-cart-btn:hover {
            background: #c0392b;
        }

        /* NOTIFICATION */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, var(--success), #128C7E);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 30px rgba(37, 211, 102, 0.5);
            z-index: 10002;
            display: none;
            animation: slideInRight 0.4s;
        }

        .notification.show {
            display: block;
        }

        @keyframes slideInRight {
            from { transform: translateX(400px); }
            to { transform: translateX(0); }
        }

        .notification i {
            margin-right: 0.5rem;
        }

        /* LOADING OVERLAY */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10003;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            text-align: center;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 215, 0, 0.3);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: bold;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .logo {
                font-size: 1.2rem;
            }

            .menu-header h1 {
                font-size: 2rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .category-tabs {
                top: 60px;
                gap: 0.5rem;
            }

            .tab-btn {
                padding: 0.6rem 1rem;
                font-size: 0.85rem;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }

            .cart-floating-btn {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }

            .item-name {
                font-size: 1.1rem;
            }

            .item-price {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- LOADING OVERLAY -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text" id="loadingText">Getting your location...</div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notification" id="notification">
        <i class="fas fa-check-circle"></i>
        <span id="notificationText">Item added to cart!</span>
    </div>

    <!-- HEADER -->
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-pizza-slice"></i>
                <span>Urban Crust</span>
            </div>
        </nav>
    </header>

    <!-- FLOATING CART BUTTON -->
    <button class="cart-floating-btn" onclick="toggleCart()" id="cartFloatingBtn">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount" style="display: none;">0</span>
    </button>

    <!-- CART SIDEBAR -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>
                <span><i class="fas fa-shopping-cart"></i> Your Order</span>
                <button class="close-cart" onclick="toggleCart()">&times;</button>
            </h2>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <i class="fas fa-shopping-cart"></i>
                <p>Your cart is empty</p>
                <p style="font-size: 0.9rem;">Start adding delicious items!</p>
            </div>
        </div>
        <div class="cart-summary" id="cartSummary" style="display: none;">
            <div class="summary-row">
                <span>Total Items:</span>
                <span id="totalItems">0</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total Amount:</span>
                <span id="totalAmount">Rs. 0</span>
            </div>
            <button class="checkout-btn" onclick="proceedToCheckout()">
                <i class="fab fa-whatsapp"></i> Send Order via WhatsApp
            </button>
            <button class="clear-cart-btn" onclick="clearCart()">
                <i class="fas fa-trash"></i> Clear Cart
            </button>
        </div>
    </div>

    <!-- SIZE SELECTION MODAL -->
    <div class="size-modal" id="sizeModal" onclick="closeSizeModal(event)">
        <div class="size-modal-content" onclick="event.stopPropagation()">
            <button class="close-size-modal" onclick="closeSizeModal()">&times;</button>
            <h3><i class="fas fa-expand-arrows-alt"></i> Choose Size</h3>
            <div class="size-options" id="sizeOptions"></div>
            <button class="confirm-size-btn" id="confirmSizeBtn" onclick="confirmSize()" disabled>
                <i class="fas fa-shopping-cart"></i> Add to Cart
            </button>
        </div>
    </div>

    <!-- MENU CONTAINER -->
    <div class="menu-container">
        <div class="menu-header">
            <h1>🍽️ Our Menu</h1>
            <p>Choose your favorites and order now!</p>
        </div>

        <!-- CATEGORY TABS -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all')">All Items</button>
            <button class="tab-btn" onclick="filterCategory('deals')">🔥 Deals</button>

        // RENDER MENU
        function renderMenu(category = 'all') {

                deals: '🔥',

                grid.className = 'menu-grid';

                menuData[cat].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-item';
                    
                    let priceDisplay = '';
                    let sizesHTML = '';
                    
                    if (item.sizes) {
                        const prices = item.sizes.map(s => s.price);
                        priceDisplay = `Rs. ${Math.min(...prices)} - ${Math.max(...prices)}`;
                        
                        sizesHTML = `

                        `;
                    } else {
                        priceDisplay = `Rs. ${item.price}`;
                    }

                    card.innerHTML = `
                        ${item.special ? '<span class="special-badge">HOT 🔥</span>' : ''}
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${priceDisplay}</div>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                        ${sizesHTML}
                        <button class="add-to-cart-btn" onclick='handleAddToCart(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);

        // FILTER CATEGORY
        function filterCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(cat);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // HANDLE ADD TO CART
        function handleAddToCart(item) {
            if (item.sizes && item.sizes.length > 0) {
                openSizeModal(item);
            } else {
                addToCart(item);
                showNotification(`${item.name} added to cart!`);
            }
        }

        // OPEN SIZE MODAL
        function openSizeModal(item) {
            currentItem = item;
            selectedSize = null;
            
            const sizeOptions = document.getElementById('sizeOptions');
            sizeOptions.innerHTML = '';
            
            item.sizes.forEach(size => {
                const option = document.createElement('div');
                option.className = 'size-option';
                option.innerHTML = `
                    <span class="size-option-name">${size.name}</span>
                    <span class="size-option-price">Rs. ${size.price}</span>
                `;
                option.onclick = () => selectSize(size, option);
                sizeOptions.appendChild(option);
            });
            
            document.getElementById('confirmSizeBtn').disabled = true;
            document.getElementById('sizeModal').classList.add('show');
        }

        // SELECT SIZE
        function selectSize(size, element) {
            document.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedSize = size;
            document.getElementById('confirmSizeBtn').disabled = false;
        }

        // CONFIRM SIZE
        function confirmSize() {
            if (selectedSize && currentItem) {
                addToCart(currentItem, selectedSize);
                closeSizeModal();
                showNotification(`${currentItem.name} (${selectedSize.name}) added to cart!`);
            }
        }

        // CLOSE SIZE MODAL
        function closeSizeModal(event) {
            if (event && event.target.classList.contains('size-modal-content')) return;
            document.getElementById('sizeModal').classList.remove('show');
        }

        // ADD TO CART
        function addToCart(item, size = null) {
            const price = size ? size.price : item.price;
            const sizeName = size ? size.name : null;
            
            const existingIndex = cart.findIndex(cartItem => 
                cartItem.name === item.name && cartItem.size === sizeName
            );

            if (existingIndex !== -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    name: item.name,
                    price: price,
                    size: sizeName,
                    quantity: 1
                });
            }

            updateCartDisplay();
        }

        // UPDATE CART DISPLAY
        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');
            const cartCount = document.getElementById('cartCount');
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            // Update cart count
            if (totalItems > 0) {
                cartCount.textContent = totalItems;
                cartCount.style.display = 'flex';
            } else {
                cartCount.style.display = 'none';
            }
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty</p>
                        <p style="font-size: 0.9rem;">Start adding delicious items!</p>
                    </div>
                `;
                cartSummary.style.display = 'none';
                return;
            }

            // Render cart items
            cartItems.innerHTML = '';
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-header">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            ${item.size ? `<div class="cart-item-size">${item.size}</div>` : ''}
                            <div class="cart-item-unit-price">Rs. ${item.price} each</div>
                        </div>
                        <div class="cart-item-total">Rs. ${itemTotal}</div>
                    </div>
                    <div class="cart-item-controls">
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${index})">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });

            // Update summary
            document.getElementById('totalItems').textContent = totalItems;
            document.getElementById('totalAmount').textContent = `Rs. ${totalAmount}`;
            cartSummary.style.display = 'block';
        }

        // UPDATE QUANTITY
        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartDisplay();
        }

        // REMOVE FROM CART
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
            showNotification('Item removed from cart');
        }

        // CLEAR CART
        function clearCart() {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                updateCartDisplay();
                showNotification('Cart cleared');
            }
        }

        // TOGGLE CART
        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('show');
        }

        // SHOW NOTIFICATION
        function showNotification(message) {
            const notification = document.getElementById('notification');
            document.getElementById('notificationText').textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // SHOW LOADING
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.add('show');
        }

        // HIDE LOADING
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        // GET USER LOCATION
        function getUserLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation not supported'));
                    return;
                }

                showLoading('📍 Getting your location...');

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude,
                            accuracy: position.coords.accuracy
                        };
                        hideLoading();
                        resolve(userLocation);
                    },
                    (error) => {
                        hideLoading();
                        reject(error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 30000,
                        maximumAge: 0
                    }
                );
            });
        }

        // PROCEED TO CHECKOUT
        async function proceedToCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            try {
                // Get location
                await getUserLocation();
                
                // Generate order message
                const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${userLocation.lat},${userLocation.lng}`;

                let message = `🍕 *URBAN CRUST ORDER*\n\n`;
                message += `🛒 *ORDER DETAILS (${totalItems} items):*\n`;
                message += `━━━━━━━━━━━━━━━\n`;
                
                cart.forEach((item, index) => {
                    message += `${index + 1}. ${item.name}`;
                    if (item.size) message += ` (${item.size})`;
                    message += `\n   Qty: ${item.quantity} × Rs. ${item.price} = Rs. ${item.price * item.quantity}\n\n`;
                });
                
                message += `━━━━━━━━━━━━━━━\n`;
                message += `💰 *TOTAL: Rs. ${totalAmount}*\n\n`;
                message += `📍 *DELIVERY LOCATION:*\n${mapsUrl}\n`;
                message += `✅ Accuracy: ±${Math.round(userLocation.accuracy)}m\n\n`;
                message += `━━━━━━━━━━━━━━━\n`;
                message += `📍 Urban Crust - Alpha Arcade E-16/3, Islamabad\n`;
                message += `☎️ 0341 977 9177\n\n`;
                message += `🌐 Order from: Urban Crust Website`;

                // Open WhatsApp
                const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                window.open(whatsappUrl, '_blank');
                
                // Clear cart after successful order
                setTimeout(() => {
                    cart = [];
                    updateCartDisplay();
                    toggleCart();
                    showNotification('✅ Order sent! Check WhatsApp');
                }, 1000);

            } catch (error) {
                console.error('Location error:', error);
                
                const proceed = confirm(
                    '❌ Could not get your location automatically.\n\n' +
                    '📱 You can share your location in WhatsApp when placing the order.\n\n' +
                    'Continue to WhatsApp?'
                );

                if (proceed) {
                    // Generate order without location
                    const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

                    let message = `🍕 *URBAN CRUST ORDER*\n\n`;
                    message += `🛒 *ORDER DETAILS (${totalItems} items):*\n`;
                    message += `━━━━━━━━━━━━━━━\n`;
                    
                    cart.forEach((item, index) => {
                        message += `${index + 1}. ${item.name}`;
                        if (item.size) message += ` (${item.size})`;
                        message += `\n   Qty: ${item.quantity} × Rs. ${item.price} = Rs. ${item.price * item.quantity}\n\n`;
                    });
                    
                    message += `━━━━━━━━━━━━━━━\n`;
                    message += `💰 *TOTAL: Rs. ${totalAmount}*\n\n`;
                    message += `📍 *DELIVERY LOCATION:*\n`;
                    message += `(Please share your location in WhatsApp)\n\n`;
                    message += `━━━━━━━━━━━━━━━\n`;
                    message += `📍 Urban Crust - Alpha Arcade E-16/3, Islamabad\n`;
                    message += `☎️ 0341 977 9177\n\n`;
                    message += `🌐 Order from: Urban Crust Website`;

                    const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
                    window.open(whatsappUrl, '_blank');
                    
                    setTimeout(() => {
                        cart = [];
                        updateCartDisplay();
                        toggleCart();
                        showNotification('✅ Order sent! Share location in WhatsApp');
                    }, 1000);
                }
            }
        }

        // INITIALIZE
        renderMenu('all');
        updateCartDisplay();
    </script>
</body>
</html>
