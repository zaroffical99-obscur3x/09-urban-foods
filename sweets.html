<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Sip - Premium Bakery & Café Menu</title>
    <meta name="description" content="Order delicious cakes, pastries, ice cream & beverages from Urban Sip - Premium Bakery in Islamabad">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧁</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-pink: #FF69B4;
            --secondary-pink: #FFB6D9;
            --light-pink: #FFF0F8;
            --cream: #FFF8DC;
            --gold: #FFD700;
            --dark-pink: #E91E63;
            --purple: #9C27B0;
            --white: #FFFFFF;
            --black: #2C1810;
        }

        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--secondary-pink) 50%, var(--primary-pink) 100%);
            color: var(--black);
            overflow-x: hidden;
            line-height: 1.6;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 182, 217, 0.2) 0%, transparent 60%);
            z-index: -1;
            animation: floatBackground 15s ease-in-out infinite;
        }

        @keyframes floatBackground {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 30px) scale(1.05); }
        }

        header {
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--dark-pink) 100%);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(255, 105, 180, 0.4);
            border-bottom: 3px solid var(--gold);
        }

        nav {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--white);
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-family: 'Brush Script MT', cursive;
            animation: logoGlow 2s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { text-shadow: 3px 3px 6px rgba(0,0,0,0.3); }
            50% { text-shadow: 3px 3px 20px rgba(255, 215, 0, 0.8); }
        }

        .logo i {
            font-size: 2.5rem;
            animation: spin 4s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .nav-links {
            display: flex;
            gap: 0.8rem;
            list-style: none;
            align-items: center;
        }

        .nav-links a {
            color: var(--white);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            padding: 0.7rem 1.2rem;
            border-radius: 30px;
            font-size: 0.95rem;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid transparent;
        }

        .nav-links a:hover {
            background: var(--white);
            color: var(--primary-pink);
            transform: translateY(-3px) scale(1.05);
            border-color: var(--gold);
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
        }

        .cart-btn {
            position: relative;
            background: linear-gradient(135deg, var(--gold), #FFA500) !important;
            color: var(--black) !important;
            font-weight: bold !important;
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
            animation: cartPulse 2s infinite;
        }

        @keyframes cartPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #FF1744;
            color: white;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            animation: badgeBounce 0.6s;
            border: 3px solid white;
        }

        @keyframes badgeBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .menu-container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 1.5rem;
        }

        .menu-header {
            text-align: center;
            padding: 3rem 1rem;
            margin-bottom: 2.5rem;
            animation: fadeInDown 1s;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 40px;
            border: 4px solid var(--gold);
            box-shadow: 0 15px 50px rgba(255, 105, 180, 0.3);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-header h1 {
            font-size: 4rem;
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
            font-family: 'Brush Script MT', cursive;
        }

        .menu-header p {
            color: var(--black);
            font-size: 1.4rem;
            font-style: italic;
        }

        .category-tabs {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2.5rem;
            position: sticky;
            top: 90px;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.2rem;
            border-radius: 30px;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.3);
            border: 3px solid var(--secondary-pink);
        }

        .tab-btn {
            background: var(--white);
            color: var(--primary-pink);
            border: 3px solid var(--primary-pink);
            padding: 1rem 2rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.4s;
            font-size: 1.05rem;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        .tab-btn:hover {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            color: var(--white);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5);
            border-color: var(--gold);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            color: var(--white);
            transform: scale(1.1);
            box-shadow: 0 10px 35px rgba(255, 105, 180, 0.6);
            border-color: var(--gold);
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 40px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            border: 4px solid var(--secondary-pink);
            animation: fadeInUp 0.8s;
            box-shadow: 0 15px 50px rgba(255, 105, 180, 0.3);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-section h2 {
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
            border-bottom: 4px solid var(--gold);
            padding-bottom: 1.5rem;
            font-family: 'Brush Script MT', cursive;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .menu-item {
            background: linear-gradient(135deg, var(--white) 0%, var(--light-pink) 100%);
            border: 3px solid var(--secondary-pink);
            border-radius: 25px;
            padding: 1.8rem;
            transition: all 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.2);
        }

        .menu-item::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 70%);
            transition: 0.6s;
            transform: scale(0);
        }

        .menu-item:hover::before {
            transform: scale(1);
        }

        .menu-item:hover {
            background: linear-gradient(135deg, var(--light-pink) 0%, var(--secondary-pink) 100%);
            border-color: var(--gold);
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 20px 50px rgba(255, 105, 180, 0.4);
        }

        .item-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 1.2rem;
            border: 3px solid var(--gold);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.4s;
        }

        .menu-item:hover .item-image {
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 12px 30px rgba(255, 215, 0, 0.4);
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .item-name {
            color: var(--black);
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Georgia', serif;
        }

        .item-price {
            color: var(--dark-pink);
            font-size: 1.6rem;
            font-weight: bold;
        }

        .item-desc {
            color: #555;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            font-style: italic;
        }

        .item-sizes {
            color: var(--primary-pink);
            font-size: 0.95rem;
            font-style: italic;
            margin-bottom: 1.2rem;
            font-weight: 600;
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            color: var(--white);
            border: none;
            padding: 1rem 1.8rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
        }

        .add-to-cart-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 10px 35px rgba(255, 105, 180, 0.6);
            background: linear-gradient(135deg, var(--dark-pink), var(--purple));
        }

        .special-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #FF1744, #F50057);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: bold;
            animation: badgeBlink 2s infinite;
            box-shadow: 0 5px 15px rgba(255, 23, 68, 0.5);
            border: 2px solid white;
        }

        @keyframes badgeBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .cart-sidebar {
            position: fixed;
            right: -500px;
            top: 0;
            width: 500px;
            height: 100vh;
            background: linear-gradient(180deg, var(--light-pink) 0%, var(--white) 100%);
            border-left: 4px solid var(--primary-pink);
            z-index: 10001;
            transition: right 0.5s ease;
            overflow-y: auto;
            box-shadow: -10px 0 50px rgba(255, 105, 180, 0.5);
        }

        .cart-sidebar.show {
            right: 0;
        }

        .cart-header {
            background: linear-gradient(135deg, var(--primary-pink), var(--dark-pink));
            padding: 1.8rem;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 3px solid var(--gold);
        }

        .cart-header h2 {
            color: var(--white);
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Brush Script MT', cursive;
        }

        .close-cart {
            background: var(--white);
            color: var(--primary-pink);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.8rem;
            transition: all 0.3s;
            border: 3px solid var(--gold);
        }

        .close-cart:hover {
            transform: rotate(90deg) scale(1.1);
            background: var(--gold);
            color: var(--white);
        }

        .cart-items {
            padding: 1.8rem;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid var(--secondary-pink);
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            animation: slideIn 0.4s;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.8rem;
        }

        .cart-item-name {
            color: var(--black);
            font-weight: bold;
            font-size: 1.2rem;
        }

        .cart-item-size {
            color: var(--primary-pink);
            font-size: 0.9rem;
            margin-top: 0.3rem;
            font-weight: 600;
        }

        .cart-item-price {
            color: var(--dark-pink);
            font-weight: bold;
            font-size: 1.3rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--light-pink);
            border-radius: 30px;
            padding: 0.5rem 1rem;
            border: 2px solid var(--secondary-pink);
        }

        .qty-btn {
            background: var(--primary-pink);
            color: var(--white);
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(255, 105, 180, 0.3);
        }

        .qty-btn:hover {
            transform: scale(1.2);
            background: var(--dark-pink);
        }

        .qty-display {
            color: var(--black);
            font-weight: bold;
            min-width: 35px;
            text-align: center;
            font-size: 1.1rem;
        }

        .remove-item {
            background: #FF1744;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .remove-item:hover {
            background: #D50000;
            transform: scale(1.1);
        }

        .cart-empty {
            text-align: center;
            padding: 4rem 1rem;
            color: #999;
        }

        .cart-empty i {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.4;
            color: var(--primary-pink);
        }

        .cart-summary {
            background: rgba(255, 255, 255, 0.95);
            border-top: 4px solid var(--primary-pink);
            padding: 1.8rem;
            position: sticky;
            bottom: 0;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            color: var(--black);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .summary-total {
            border-top: 3px solid var(--gold);
            padding-top: 1.2rem;
            margin-top: 1.2rem;
            font-weight: bold;
            font-size: 1.8rem;
            color: var(--dark-pink);
        }

        .checkout-btn {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 1.3rem;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.4s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.2rem;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
        }

        .checkout-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 40px rgba(37, 211, 102, 0.6);
        }

        .clear-cart-btn {
            background: #FF1744;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 0.8rem;
            transition: all 0.3s;
        }

        .clear-cart-btn:hover {
            background: #D50000;
            transform: scale(1.05);
        }

        .size-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 10002;
            align-items: center;
            justify-content: center;
        }

        .size-modal.show {
            display: flex;
            animation: fadeIn 0.4s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .size-modal-content {
            background: linear-gradient(135deg, var(--light-pink), var(--white));
            border-radius: 35px;
            padding: 2.5rem;
            max-width: 550px;
            width: 90%;
            border: 4px solid var(--primary-pink);
            position: relative;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.5);
        }

        .size-modal h3 {
            color: var(--primary-pink);
            font-size: 2.2rem;
            margin-bottom: 2rem;
            text-align: center;
            font-family: 'Brush Script MT', cursive;
        }

        .size-options {
            display: grid;
            gap: 1.2rem;
            margin-bottom: 1.8rem;
        }

        .size-option {
            background: var(--white);
            color: var(--black);
            border: 3px solid var(--secondary-pink);
            padding: 1.5rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.2);
        }

        .size-option:hover {
            background: var(--light-pink);
            transform: scale(1.03);
            border-color: var(--primary-pink);
        }

        .size-option.selected {
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            color: var(--white);
            transform: scale(1.08);
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.5);
        }

        .size-option-name {
            font-size: 1.4rem;
        }

        .size-option-price {
            color: var(--dark-pink);
            font-size: 1.5rem;
        }

        .size-option.selected .size-option-price {
            color: var(--gold);
        }

        .confirm-size-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--purple));
            color: var(--white);
            border: none;
            padding: 1.2rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1.2rem;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.4);
        }

        .confirm-size-btn:hover {
            transform: scale(1.06);
        }

        .confirm-size-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.4rem;
            }

            .logo i {
                font-size: 1.8rem;
            }

            .nav-links {
                gap: 0.3rem;
            }

            .nav-links a {
                padding: 0.6rem 0.8rem;
                font-size: 0.8rem;
            }

            .menu-header h1 {
                font-size: 2.5rem;
            }

            .menu-grid {
                grid-template-columns: 1fr;
            }

            .category-tabs {
                top: 75px;
                gap: 0.6rem;
                padding: 1rem;
            }

            .tab-btn {
                padding: 0.8rem 1.2rem;
                font-size: 0.9rem;
            }

            .cart-sidebar {
                width: 100%;
                right: -100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <i class="fas fa-lemon"></i>
                <span>Urban Sip</span>
            </div>
            <ul class="nav-links">
                <li><a href="#"><i class="fas fa-home"></i> Home</a></li>
                <li><a href="#menu"><i class="fas fa-book-open"></i> Menu</a></li>
                <li><a href="#contact"><i class="fas fa-phone"></i> Contact</a></li>
                <li><a href="#" class="cart-btn" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i> Cart
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>
                <span><i class="fas fa-shopping-bag"></i> Your Cart</span>
                <button class="close-cart" onclick="toggleCart()">&times;</button>
            </h2>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">
                <i class="fas fa-shopping-bag"></i>
                <p>Your cart is empty</p>
                <p style="font-size: 1rem;">Add some sweet treats!</p>
            </div>
        </div>
        <div class="cart-summary" id="cartSummary" style="display: none;">
            <div class="summary-row">
                <span>Subtotal:</span>
                <span id="subtotal">Rs. 0</span>
            </div>
            <div class="summary-row summary-total">
                <span>Total:</span>
                <span id="total">Rs. 0</span>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">
                <i class="fab fa-whatsapp"></i> Checkout via WhatsApp
            </button>
            <button class="clear-cart-btn" onclick="clearCart()">
                <i class="fas fa-trash"></i> Clear Cart
            </button>
        </div>
    </div>

    <div class="menu-container">
        <div class="menu-header">
            <h1>🧁 Sweet Delights Menu</h1>
            <p>Indulge in Premium Bakery & Café Experience</p>
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="filterCategory('all')">All Items</button>
            <button class="tab-btn" onclick="filterCategory('cakes')">🎂 Cakes</button>
            <button class="tab-btn" onclick="filterCategory('pastries')">🥐 Pastries</button>
            <button class="tab-btn" onclick="filterCategory('icecream')">🍦 Ice Cream</button>
            <button class="tab-btn" onclick="filterCategory('beverages')">☕ Beverages</button>
        </div>

        <div id="menuContent"></div>
    </div>

    <div class="size-modal" id="sizeModal">
        <div class="size-modal-content">
            <h3><i class="fas fa-expand-alt"></i> Select Size</h3>
            <div class="size-options" id="sizeOptions"></div>
            <button class="confirm-size-btn" id="confirmSizeBtn" onclick="confirmSize()" disabled>
                <i class="fas fa-check-circle"></i> Add to Cart
            </button>
        </div>
    </div>

    <script>
        const phoneNumber = "+923102306333";
        let cart = [];
        let currentItem = null;
        let selectedSize = null;
        
        const menuData = {
            cakes: [
                {name: "Donut", price: 180, desc: "Soft & fluffy donuts", image: "https://images.unsplash.com/photo-1551024601-bec78aea704b?w=400"},
                {name: "Cupcake", price: 180, desc: "Delicious cupcakes", image: "https://images.unsplash.com/photo-1587668178277-295251f900ce?w=400"},
                {name: "Brownie", price: 280, desc: "Rich chocolate brownie", image: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=400", special: true},
                {name: "Red Velvet", price: 2900, desc: "Premium red velvet cake - 2.5 pound", image: "https://images.unsplash.com/photo-1586985289688-ca3cf47d3e6e?w=400", special: true},
                {name: "Lotus Cake", price: 3000, desc: "Lotus biscoff delight - 2.5 pound", image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400", special: true},
                {name: "Cream Cake", price: 1200, desc: "Fresh cream cake - 1 pound", image: "https://images.unsplash.com/photo-1588195538326-c5b1e5b80d18?w=400"},
                {name: "Black Forest", price: 2800, desc: "Classic black forest - 2.5 pound", image: "https://images.unsplash.com/photo-1606890737304-57a1ca8a5b62?w=400"},
                {name: "Chocolate Fudge", price: 2500, desc: "Rich chocolate fudge - 2 pound", image: "https://images.unsplash.com/photo-1578775887804-699de7086ff9?w=400"},
                {name: "Strawberry Cake", price: 2700, desc: "Fresh strawberry cake - 2.5 pound", image: "https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=400"}
            ],
            pastries: [
                {name: "Chocolate Éclair", price: 250, desc: "French chocolate éclair", image: "https://images.unsplash.com/photo-1612201142855-o87d5049681d?w=400"},
                {name: "Croissant", price: 200, desc: "Buttery flaky croissant", image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400"},
                {name: "Danish Pastry", price: 280, desc: "Sweet danish pastry", image: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400"},
                {name: "Fruit Tart", price: 320, desc: "Fresh fruit tart", image: "https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=400", special: true},
                {name: "Chocolate Roll", price: 220, desc: "Swiss chocolate roll", image: "https://images.unsplash.com/photo-1607920591413-4ec007e70023?w=400"},
                {name: "Macaron Box", price: 800, desc: "Assorted macarons (6pc)", image: "https://images.unsplash.com/photo-1571506165871-ce0bbe5ae4c5?w=400", special: true}
            ],
            icecream: [
                {name: "Chocolate", sizes: [{name: "Single", price: 200}, {name: "Double", price: 350}], desc: "Rich chocolate ice cream", image: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400"},
                {name: "Kulfa", sizes: [{name: "Single", price: 200}, {name: "Double", price: 350}], desc: "Traditional kulfa", image: "https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=400", special: true},
                {name: "Mango", sizes: [{name: "Single", price: 200}, {name: "Double", price: 350}], desc: "Fresh mango ice cream", image: "https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=400"},
                {name: "Strawberry", sizes: [{name: "Single", price: 200}, {name: "Double", price: 350}], desc: "Sweet strawberry ice cream", image: "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=400"},
                {name: "Vanilla", sizes: [{name: "Single", price: 200}, {name: "Double", price: 350}], desc: "Classic vanilla ice cream", image: "https://images.unsplash.com/photo-1570197788417-0e82375c9371?w=400"}
            ],
            beverages: [
                {name: "Cappuccino", price: 550, desc: "Classic cappuccino", image: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=400"},
                {name: "Latte", price: 600, desc: "Smooth café latte", image: "https://images.unsplash.com/photo-1561882468-9110e03e0f78?w=400"},
                {name: "Mocha Latte", price: 600, desc: "Chocolate mocha latte", image: "https://images.unsplash.com/photo-1607434472257-d9f8e57a643d?w=400"},
                {name: "Ice Latte", price: 450, desc: "Cold ice latte", image: "https://images.unsplash.com/photo-1517487881594-2787fef5ebf7?w=400"},
                {name: "Chocolate Shake", price: 550, desc: "Creamy chocolate shake", image: "https://images.unsplash.com/photo-1572490122747-3968b75cc699?w=400", special: true},
                {name: "Strawberry Shake", price: 600, desc: "Fresh strawberry shake", image: "https://images.unsplash.com/photo-1623065422902-30a2d299bbe4?w=400"},
                {name: "Mango Shake", price: 550, desc: "Tropical mango shake", image: "https://images.unsplash.com/photo-1600271886742-f049cd451bba?w=400"},
                {name: "Peach Tea", price: 690, desc: "Refreshing peach tea", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400"},
                {name: "Lemon Tea", price: 600, desc: "Fresh lemon tea", image: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400"},
                {name: "Love Me Mojito", price: 500, desc: "Signature mojito", image: "https://images.unsplash.com/photo-1551538827-9c037cb4f32a?w=400", special: true},
                {name: "Hot Chocolate", price: 500, desc: "Rich hot chocolate", image: "https://images.unsplash.com/photo-1542990253-a781e04c0082?w=400"},
                {name: "Green Tea", price: 100, desc: "Healthy green tea", image: "https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400"}
            ]
        };

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('show');
        }

        function updateCartBadge() {
            const badge = document.getElementById('cartBadge');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalItems > 0) {
                badge.textContent = totalItems;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function updateCartDisplay() {
            const cartItems = document.getElementById('cartItems');
            const cartSummary = document.getElementById('cartSummary');
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="cart-empty">
                        <i class="fas fa-shopping-bag"></i>
                        <p>Your cart is empty</p>
                        <p style="font-size: 1rem;">Add some sweet treats!</p>
                    </div>
                `;
                cartSummary.style.display = 'none';
                return;
            }

            cartItems.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-header">
                        <div>
                            <div class="cart-item-name">${item.name}</div>
                            ${item.size ? `<div class="cart-item-size">${item.size}</div>` : ''}
                        </div>
                        <div class="cart-item-price">Rs. ${itemTotal}</div>
                    </div>
                    <div class="cart-item-controls">
                        <div class="quantity-controls">
                            <button class="qty-btn" onclick="updateQuantity(${index}, -1)">−</button>
                            <span class="qty-display">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                        <button class="remove-item" onclick="removeFromCart(${index})">
                            <i class="fas fa-trash"></i> Remove
                        </button>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });

            document.getElementById('subtotal').textContent = `Rs. ${total}`;
            document.getElementById('total').textContent = `Rs. ${total}`;
            cartSummary.style.display = 'block';
            updateCartBadge();
        }

        function addToCart(item, size = null) {
            const price = size ? size.price : item.price;
            const sizeName = size ? size.name : null;
            
            const existingIndex = cart.findIndex(cartItem => 
                cartItem.name === item.name && cartItem.size === sizeName
            );

            if (existingIndex !== -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    name: item.name,
                    price: price,
                    size: sizeName,
                    quantity: 1
                });
            }

            updateCartDisplay();
            
            const badge = document.getElementById('cartBadge');
            badge.style.animation = 'none';
            setTimeout(() => {
                badge.style.animation = 'badgeBounce 0.6s';
            }, 10);
        }

        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            updateCartDisplay();
        }

        function removeFromCart(index) {
            if (confirm('Remove this item from cart?')) {
                cart.splice(index, 1);
                updateCartDisplay();
            }
        }

        function clearCart() {
            if (confirm('Clear all items from cart?')) {
                cart = [];
                updateCartDisplay();
            }
        }

        function openAddToCart(item) {
            if (item.sizes && item.sizes.length > 0) {
                currentItem = item;
                selectedSize = null;
                
                const sizeOptions = document.getElementById('sizeOptions');
                sizeOptions.innerHTML = '';
                
                item.sizes.forEach(size => {
                    const sizeOption = document.createElement('div');
                    sizeOption.className = 'size-option';
                    sizeOption.innerHTML = `
                        <span class="size-option-name">${size.name}</span>
                        <span class="size-option-price">Rs. ${size.price}</span>
                    `;
                    sizeOption.onclick = () => selectSizeOption(size, sizeOption);
                    sizeOptions.appendChild(sizeOption);
                });
                
                document.getElementById('confirmSizeBtn').disabled = true;
                document.getElementById('sizeModal').classList.add('show');
            } else {
                addToCart(item);
                alert('✅ Added to cart!');
            }
        }

        function selectSizeOption(size, element) {
            document.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedSize = size;
            document.getElementById('confirmSizeBtn').disabled = false;
        }

        function confirmSize() {
            if (selectedSize && currentItem) {
                addToCart(currentItem, selectedSize);
                document.getElementById('sizeModal').classList.remove('show');
                alert('✅ Added to cart!');
            }
        }

        function openCheckout() {
            if (cart.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            let message = `🧁 *URBAN SIP ORDER*\n\n`;
            message += `🛒 *ORDER DETAILS (${totalItems} items):*\n`;
            message += `───────────────\n`;
            
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name}`;
                if (item.size) message += ` (${item.size})`;
                message += `\n   Qty: ${item.quantity} × Rs. ${item.price} = Rs. ${item.price * item.quantity}\n\n`;
            });
            
            message += `───────────────\n`;
            message += `💰 *TOTAL: Rs. ${total}*\n\n`;
            message += `📍 Urban Sip - Premium Bakery\nAlpha Arcade E-16/3, Islamabad\n☎️ 0310 230 6333`;

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
            
            alert('✅ Order sent!\n\n📱 Opening WhatsApp...\n\n🛒 Your cart will be cleared.');
            
            cart = [];
            updateCartDisplay();
            toggleCart();
        }

        function renderMenu(category = 'all') {
            const container = document.getElementById('menuContent');
            container.innerHTML = '';

            const categories = category === 'all' ? Object.keys(menuData) : [category];

            categories.forEach(cat => {
                const section = document.createElement('div');
                section.className = 'menu-section';
                section.id = cat;
                section.dataset.category = cat;

                const categoryEmojis = {
                    cakes: '🎂',
                    pastries: '🥐',
                    icecream: '🍦',
                    beverages: '☕'
                };

                section.innerHTML = `<h2>${categoryEmojis[cat]} ${cat.charAt(0).toUpperCase() + cat.slice(1)}</h2>`;

                const grid = document.createElement('div');
                grid.className = 'menu-grid';

                menuData[cat].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'menu-item';
                    
                    let priceDisplay = '';
                    if (item.sizes) {
                        const prices = item.sizes.map(s => s.price);
                        priceDisplay = prices.length > 1 ? `Rs. ${Math.min(...prices)} - ${Math.max(...prices)}` : `Rs. ${prices[0]}`;
                    } else {
                        priceDisplay = `Rs. ${item.price}`;
                    }

                    card.innerHTML = `
                        ${item.special ? '<span class="special-badge">SPECIAL!</span>' : ''}
                        <img src="${item.image}" alt="${item.name}" class="item-image" onerror="this.src='https://via.placeholder.com/400x300/FFB6D9/FFFFFF?text=${encodeURIComponent(item.name)}'">
                        <div class="item-header">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${priceDisplay}</div>
                        </div>
                        <div class="item-desc">${item.desc}</div>
                        ${item.sizes ? `<div class="item-sizes">Available: ${item.sizes.map(s => s.name).join(', ')}</div>` : ''}
                        <button class="add-to-cart-btn" onclick='openAddToCart(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                            <i class="fas fa-cart-plus"></i> Add to Cart
                        </button>
                    `;
                    grid.appendChild(card);
                });

                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu(cat);
        }

        document.getElementById('sizeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
            }
        });

        renderMenu('all');
        updateCartDisplay();
    </script>
</body>
</html>
